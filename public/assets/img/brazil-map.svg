<svg viewBox="0 0 480 520" xmlns="http://www.w3.org/2000/svg" id="tcBrazilMap">
  <!--
    Mapa estilizado do Brasil (cartograma simplificado em grade), Fase 2.
    Não é geograficamente preciso, mas mantém a posição relativa aproximada
    das 27 UFs (Norte no topo, Sul embaixo, Nordeste à direita superior,
    Centro-Oeste ao centro, Sudeste ao centro-sul).
    Cada estado é um <rect class="uf-state" data-uf="XX"> + <text>.
    A cor de preenchimento é definida via JS (public/assets/js/app.js /
    inline no controller de Indicadores) de acordo com a intensidade de leads.
  -->
  <g font-family="'Segoe UI', Roboto, Arial, sans-serif">
    <rect class="uf-state" data-uf="RR" x="148" y="20"  width="56" height="44" rx="8"/>
    <text class="uf-label" x="176" y="46" text-anchor="middle">RR</text>

    <rect class="uf-state" data-uf="AP" x="212" y="20"  width="56" height="44" rx="8"/>
    <text class="uf-label" x="240" y="46" text-anchor="middle">AP</text>

    <rect class="uf-state" data-uf="AM" x="84" y="74"  width="56" height="44" rx="8"/>
    <text class="uf-label" x="112" y="100" text-anchor="middle">AM</text>

    <rect class="uf-state" data-uf="PA" x="212" y="74"  width="56" height="44" rx="8"/>
